<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to FABRICFOLD LAUNDRY SOLUTION</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      (function() {
        var l = window.location;
        var path = l.pathname;
        var parts = path.split('/').filter(Boolean);
        var repoName = parts.length > 0 && parts[0].toLowerCase() === 'fabricfold-laundry-solution' 
          ? parts[0] 
          : '';
        var basePath = repoName ? '/' + repoName + '/' : '/';
        var subPath = repoName ? path.slice(basePath.length) : path.slice(1);
        
        var redirectUrl = l.protocol + '//' + l.host + basePath + 
          (subPath ? '#/' + subPath : '') + 
          (l.search ? (subPath ? '?' : '?') + l.search.slice(1) : '') + 
          (l.hash ? l.hash : '');
          
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background: #020617; color: #94a3b8;">
    <p>Loading FABRICFOLD LAUNDRY SOLUTION...</p>
  </body>
</html>
